<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双拼打字练习 - 微软 / 小鹤</title>
<link rel="icon" type="image/png" href="../avatars/splogo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #14151b 0%, #1e2030 100%);
    color: #e8e8ec;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px;
  }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .head .logo { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 4px 16px rgba(91,141,239,.35); }
  h1 { font-size: 26px; letter-spacing: 2px; }
  .sub { color: #8a8d99; font-size: 13px; margin-bottom: 22px; text-align: center; }

  .card {
    background: #26272f; border-radius: 14px; padding: 28px 32px;
    width: 100%; max-width: 760px; box-shadow: 0 4px 20px rgba(0,0,0,.35);
  }

  .schemes { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
  .scheme-btn {
    background: #33343e; border: 2px solid #44454f; border-radius: 10px;
    padding: 10px 22px; cursor: pointer; color: #9a9daa; font-size: 14px; transition: all .15s;
  }
  .scheme-btn.active { border-color: #5b8def; color: #fff; background: rgba(91,141,239,.15); }
  .scheme-btn:hover { border-color: #5b8def; }

  .modes { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .mode-btn {
    background: #33343e; border: 2px solid #44454f; border-radius: 12px;
    padding: 22px 34px; cursor: pointer; text-align: center; color: #e8e8ec;
    transition: all .15s; min-width: 210px;
  }
  .mode-btn:hover { border-color: #5b8def; transform: translateY(-2px); }
  .mode-btn .t { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
  .mode-btn .d { font-size: 13px; color: #9a9daa; line-height: 1.6; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-size: 14px; color: #9a9daa; gap: 10px; flex-wrap: wrap; }
  .topbar .timer { font-variant-numeric: tabular-nums; font-size: 16px; color: #ffd166; }
  .back { cursor: pointer; color: #8a8d99; background: none; border: none; font-size: 14px; }
  .back:hover { color: #fff; }
  .scheme-switch { display: flex; gap: 6px; }
  .scheme-switch button {
    background: #33343e; border: 1px solid #44454f; border-radius: 8px; color: #9a9daa;
    padding: 4px 12px; cursor: pointer; font-size: 13px;
  }
  .scheme-switch button.active { border-color: #5b8def; color: #fff; }

  .quiz { text-align: center; }
  .char { font-size: 88px; line-height: 1.2; margin: 8px 0 2px; }
  .pinyin { font-size: 20px; color: #9a9daa; margin-bottom: 18px; }

  .slots { display: flex; gap: 12px; justify-content: center; margin-bottom: 14px; }
  .slot {
    width: 64px; height: 72px; border-radius: 10px; background: #1b1c22;
    border: 2px solid #3a3b45; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: bold; text-transform: uppercase;
  }
  .slot.active { border-color: #5b8def; }
  .slots.ok .slot { border-color: #4caf7d; color: #4caf7d; background: rgba(76,175,125,.08); }
  .slots.bad .slot { border-color: #e5534b; color: #e5534b; background: rgba(229,83,75,.08); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px);} 50% { transform: translateX(6px);} 75% { transform: translateX(-4px);} }

  .feedback { min-height: 46px; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
  .feedback .good { color: #4caf7d; }
  .feedback .bad { color: #e5534b; }
  .feedback .hint { color: #ffd166; }

  .progress { font-size: 13px; color: #8a8d99; margin-top: 6px; }

  .kbd { margin-top: 22px; display: flex; flex-direction: column; gap: 7px; align-items: center; }
  .krow { display: flex; gap: 7px; }
  .key {
    width: 60px; height: 62px; border-radius: 8px; background: #2e2f38;
    border: 1px solid #41424c; border-bottom-width: 3px; padding: 4px 5px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 11px; color: #b9bccd; text-align: left; transition: background .1s;
  }
  .key .cap { font-size: 15px; font-weight: bold; color: #fff; }
  .key .init { color: #5b8def; font-weight: bold; }
  .key .finals { color: #ffd166; line-height: 1.25; word-break: break-all; }
  .key.pressed { background: #5b8def; }
  .key.pressed .cap, .key.pressed .init, .key.pressed .finals { color: #fff; }
  .key.wanted { border-color: #4caf7d; box-shadow: 0 0 10px rgba(76,175,125,.55); }
  .kbd-note { margin-top: 10px; font-size: 12px; color: #8a8d99; text-align: center; line-height: 1.7; }

  .result { text-align: center; }
  .result .big { font-size: 44px; margin: 10px 0 18px; }
  .stats { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { background: #1b1c22; border-radius: 10px; padding: 14px 22px; min-width: 120px; }
  .stat .v { font-size: 26px; font-weight: bold; color: #5b8def; }
  .stat .k { font-size: 12px; color: #8a8d99; margin-top: 4px; }
  .btns { display: flex; gap: 14px; justify-content: center; }
  .btn {
    background: #5b8def; border: none; border-radius: 10px; color: #fff;
    font-size: 16px; padding: 12px 30px; cursor: pointer;
  }
  .btn.ghost { background: #33343e; }
  .btn:hover { filter: brightness(1.12); }

  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .key { width: 44px; height: 56px; font-size: 9px; }
    .char { font-size: 64px; }
    .card { padding: 20px 14px; }
  }
</style>
</head>
<body>
  <div class="head">
    <img class="logo" src="../avatars/splogo.png" alt="双拼">
    <h1>双拼打字练习</h1>
  </div>
  <div class="sub">每组 10 题 · 两键一字 · 支持 微软 / 小鹤 双拼</div>

  <!-- 主菜单 -->
  <div id="menu" class="card">
    <div class="schemes">
      <button class="scheme-btn active" data-scheme="ms" onclick="pickScheme('ms')">微软双拼</button>
      <button class="scheme-btn" data-scheme="xh" onclick="pickScheme('xh')">小鹤双拼</button>
    </div>
    <div class="modes">
      <div class="mode-btn" onclick="startGame('practice')">
        <div class="t">练习模式</div>
        <div class="d">屏幕显示键位图与按键提示<br>答错会提示正确拆法<br>打对才能进入下一题</div>
      </div>
      <div class="mode-btn" onclick="startGame('race')">
        <div class="t">比赛模式</div>
        <div class="d">不显示键位图<br>计时挑战 · 统计速度<br>考验真实熟练度</div>
      </div>
    </div>
  </div>

  <!-- 答题区 -->
  <div id="game" class="card hidden">
    <div class="topbar">
      <button class="back" onclick="toMenu()">← 返回菜单</button>
      <span class="scheme-switch">
        <button data-scheme="ms" onclick="pickScheme('ms', true)">微软</button>
        <button data-scheme="xh" onclick="pickScheme('xh', true)">小鹤</button>
      </span>
      <span id="modeLabel"></span>
      <span id="timer" class="timer hidden">0.0s</span>
    </div>
    <div class="quiz">
      <div id="qchar" class="char"></div>
      <div id="qpinyin" class="pinyin"></div>
      <div id="slots" class="slots">
        <div class="slot active" id="slot0"></div>
        <div class="slot" id="slot1"></div>
      </div>
      <div id="feedback" class="feedback"></div>
      <div id="progress" class="progress"></div>
    </div>
    <div id="kbdWrap">
      <div class="kbd" id="kbd"></div>
      <div class="kbd-note" id="kbdNote"></div>
    </div>
  </div>

  <!-- 结算 -->
  <div id="result" class="card hidden">
    <div class="result">
      <div id="resultTitle" class="big"></div>
      <div class="stats" id="stats"></div>
      <div class="btns">
        <button class="btn" onclick="restart()">再来一组</button>
        <button class="btn ghost" onclick="toMenu()">返回菜单</button>
      </div>
    </div>
  </div>

<script>
const SCHEMES = {
  ms: {
    name: '微软双拼',
    keyRow: [
      [{k:'q',f:['iu']},{k:'w',f:['ia','ua']},{k:'e',f:['e']},{k:'r',f:['uan']},{k:'t',f:['ue']},{k:'y',f:['uai','ü']},{k:'u',init:'sh',f:['u']},{k:'i',init:'ch',f:['i']},{k:'o',f:['o','uo']},{k:'p',f:['un']}],
      [{k:'a',f:['a']},{k:'s',f:['ong','iong']},{k:'d',f:['iang','uang']},{k:'f',f:['en']},{k:'g',f:['eng']},{k:'h',f:['ang']},{k:'j',f:['an']},{k:'k',f:['ao']},{k:'l',f:['ai']},{k:';',f:['ing']}],
      [{k:'z',f:['ei']},{k:'x',f:['ie']},{k:'c',f:['iao']},{k:'v',init:'zh',f:['ui']},{k:'b',f:['ou']},{k:'n',f:['in']},{k:'m',f:['ian']}]
    ],
    zero: { a:'oa', ai:'ol', an:'oj', ang:'oh', ao:'ok', e:'oe', ei:'oz', en:'of', eng:'og', er:'or', o:'oo', ou:'ob' },
    final: { a:'a',o:'o',e:'e',i:'i',u:'u',v:'y', ai:'l',ei:'z',ui:'v',ao:'k',ou:'b',iu:'q',ie:'x',ue:'t',ve:'t',er:'r', an:'j',en:'f',in:'n',un:'p',ang:'h',eng:'g',ing:';',ong:'s',iong:'s', ia:'w',iao:'c',ian:'m',iang:'d',ua:'w',uo:'o',uai:'y',uan:'r',uang:'d' },
    note: '翘舌音 zh = V · ch = I · sh = U &nbsp;|&nbsp; ing = 分号(;)键<br>零声母: 先按 O 再按韵母键 (爱 ai → O+L · 安 an → O+J · 昂 ang → O+H)'
  },
  xh: {
    name: '小鹤双拼',
    keyRow: [
      [{k:'q',f:['iu']},{k:'w',f:['ei']},{k:'e',f:['e']},{k:'r',f:['uan']},{k:'t',f:['ue']},{k:'y',f:['un']},{k:'u',init:'sh',f:['u']},{k:'i',init:'ch',f:['i']},{k:'o',f:['o','uo']},{k:'p',f:['ie']}],
      [{k:'a',f:['a']},{k:'s',f:['ong','iong']},{k:'d',f:['ai']},{k:'f',f:['en']},{k:'g',f:['eng']},{k:'h',f:['ang']},{k:'j',f:['an']},{k:'k',f:['ing','uai']},{k:'l',f:['iang','uang']}],
      [{k:'z',f:['ou']},{k:'x',f:['ia','ua']},{k:'c',f:['ao']},{k:'v',init:'zh',f:['ui','ü']},{k:'b',f:['in']},{k:'n',f:['iao']},{k:'m',f:['ian']}]
    ],
    zero: { a:'aa', ai:'ai', an:'an', ang:'ah', ao:'ao', e:'ee', ei:'ei', en:'en', eng:'eg', er:'er', o:'oo', ou:'ou' },
    final: { a:'a',o:'o',e:'e',i:'i',u:'u',v:'v', ai:'d',ei:'w',ui:'v',ao:'c',ou:'z',iu:'q',ie:'p',ue:'t',ve:'t',er:'r', an:'j',en:'f',in:'b',un:'y',ang:'h',eng:'g',ing:'k',ong:'s',iong:'s', ia:'x',iao:'n',ian:'m',iang:'l',ua:'x',uo:'o',uai:'k',uan:'r',uang:'l' },
    note: '翘舌音 zh = V · ch = I · sh = U<br>零声母: 按表整打 (安 an → A+N · 爱 ai → A+I · 昂 ang → A+H)'
  }
};

const INITIALS = 'bpmfdtnlgkhjqxrzcsyw';

let scheme = 'ms';

function solve(py) {
  py = py.toLowerCase();
  const S = SCHEMES[scheme];
  if (S.zero[py]) return { init: '(零声母)', initKey: S.zero[py][0], final: py, finalKey: S.zero[py][1], code: S.zero[py] };
  let init, rest;
  if (/^(zh|ch|sh)/.test(py)) { init = py.slice(0, 2); rest = py.slice(2); }
  else if (INITIALS.includes(py[0])) { init = py[0]; rest = py.slice(1); }
  else return null;
  if (rest === 'u' && 'jqxy'.includes(init)) rest = 'v';
  const initKey = { zh: 'v', ch: 'i', sh: 'u' }[init] || init;
  const finalKey = S.final[rest] || rest;
  return { init, initKey, final: rest.replace('v', 'ü').replace('ue', 'üe'), finalKey, code: initKey + finalKey };
}

const $ = id => document.getElementById(id);
let mode, questions, qi, typed, errors, firstTry, startTime, timerInt, locked;

function pickScheme(s, fromGame) {
  scheme = s;
  document.querySelectorAll('.schemes .scheme-btn, .scheme-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.scheme === s);
  });
  if ($('game') && !$('game').classList.contains('hidden')) {
    if (!$('kbdWrap').classList.contains('hidden')) buildKbd();
    if (qi >= 0) { typed = ''; renderSlots(); loadQuestion(); }
  }
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame(m) {
  mode = m;
  questions = shuffle([...BANK]).slice(0, 10);
  qi = 0; errors = 0; firstTry = 0;
  $('menu').classList.add('hidden');
  $('result').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('modeLabel').textContent = (m === 'practice' ? '练习模式' : '比赛模式') + ' · ' + SCHEMES[scheme].name;
  $('kbdWrap').classList.toggle('hidden', m === 'race');
  if (m === 'race') {
    startTime = performance.now();
    $('timer').classList.remove('hidden');
    timerInt = setInterval(() => {
      $('timer').textContent = ((performance.now() - startTime) / 1000).toFixed(1) + 's';
    }, 100);
  } else {
    clearInterval(timerInt);
    $('timer').classList.add('hidden');
  }
  buildKbd();
  loadQuestion();
}

function loadQuestion() {
  typed = ''; locked = false;
  const [ch, py] = questions[qi];
  const s = solve(py);
  $('qchar').textContent = ch;
  $('qpinyin').textContent = py + ' → ' + (s ? s.code.toUpperCase() : '?');
  $('progress').textContent = `第 ${qi + 1} / 10 题 · 答错 ${errors} 次`;
  $('slots').className = 'slots';
  $('slot0').textContent = ''; $('slot1').textContent = '';
  $('slot0').classList.add('active'); $('slot1').classList.remove('active');
  $('feedback').innerHTML = mode === 'practice' ? '请输入这个字的双拼(两个键)' : '';
  markWanted(s);
}

function markWanted(s) {
  document.querySelectorAll('.key.wanted').forEach(el => el.classList.remove('wanted'));
  if (!s || mode !== 'practice') return;
  [...s.code].forEach(k => {
    const el = document.querySelector(`.key[data-k="${k === ';' ? 'semi' : k}"]`);
    if (el) el.classList.add('wanted');
  });
}

function showHint() {
  const [, py] = questions[qi];
  const s = solve(py);
  $('feedback').innerHTML =
    `<span class="bad">不对哦</span> <span class="hint">「${py}」= ${s.init} → <b>${s.initKey.toUpperCase()}</b> + ${s.final} → <b>${s.finalKey.toUpperCase()}</b>,答案是 <b>${s.code.toUpperCase()}</b></span>`;
}

document.addEventListener('keydown', e => {
  if ($('game').classList.contains('hidden') || locked) return;
  if (e.key === 'Backspace') {
    if (typed.length) { typed = typed.slice(0, -1); renderSlots(); }
    return;
  }
  const k = e.key.toLowerCase();
  if (!/^[a-z;]$/.test(k) || typed.length >= 2) return;
  typed += k;
  renderSlots();
  flashKey(k);
  if (typed.length === 2) check();
});

function renderSlots() {
  $('slot0').textContent = typed[0] || '';
  $('slot1').textContent = typed[1] || '';
  $('slot0').classList.toggle('active', typed.length === 0);
  $('slot1').classList.toggle('active', typed.length === 1);
}

function flashKey(k) {
  const el = document.querySelector(`.key[data-k="${k === ';' ? 'semi' : k}"]`);
  if (!el) return;
  el.classList.add('pressed');
  setTimeout(() => el.classList.remove('pressed'), 200);
}

function check() {
  const [, py] = questions[qi];
  const s = solve(py);
  if (typed === s.code) {
    $('slots').className = 'slots ok';
    if (!$('feedback').dataset.err) firstTry++;
    $('feedback').innerHTML = `<span class="good">✓ 正确! ${s.init} → ${s.initKey.toUpperCase()} · ${s.final} → ${s.finalKey.toUpperCase()}</span>`;
    locked = true;
    setTimeout(next, mode === 'practice' ? 700 : 400);
  } else {
    errors++;
    $('slots').className = 'slots bad';
    showHint();
    $('feedback').dataset.err = '1';
    $('progress').textContent = `第 ${qi + 1} / 10 题 · 答错 ${errors} 次`;
    locked = true;
    setTimeout(() => {
      typed = ''; locked = false;
      $('slots').className = 'slots';
      renderSlots();
    }, 900);
  }
}

function next() {
  delete $('feedback').dataset.err;
  qi++;
  if (qi >= 10) return finish();
  loadQuestion();
}

function finish() {
  clearInterval(timerInt);
  const secs = (performance.now() - startTime) / 1000;
  $('game').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('resultTitle').textContent = mode === 'practice' ? '练习完成!' : '比赛结束!';
  let html = `<div class="stat"><div class="v">${firstTry}/10</div><div class="k">一次答对</div></div>
              <div class="stat"><div class="v">${errors}</div><div class="k">总错误次数</div></div>`;
  if (mode === 'race') {
    html += `<div class="stat"><div class="v">${(600 / secs).toFixed(1)}</div><div class="k">字 / 分钟</div></div>
             <div class="stat"><div class="v">${secs.toFixed(1)}s</div><div class="k">总用时</div></div>`;
  }
  $('stats').innerHTML = html;
}

function restart() { startGame(mode); }

function toMenu() {
  clearInterval(timerInt);
  $('game').classList.add('hidden');
  $('result').classList.add('hidden');
  $('menu').classList.remove('hidden');
}

function buildKbd() {
  const S = SCHEMES[scheme];
  const kbd = $('kbd');
  kbd.innerHTML = '';
  S.keyRow.forEach(row => {
    const div = document.createElement('div');
    div.className = 'krow';
    row.forEach(info => {
      const el = document.createElement('div');
      el.className = 'key';
      el.dataset.k = info.k === ';' ? 'semi' : info.k;
      el.innerHTML = `<div><span class="cap">${info.k === ';' ? ';' : info.k.toUpperCase()}</span>` +
        (info.init ? ` <span class="init">${info.init}</span>` : '') + '</div>' +
        `<div class="finals">${info.f.join(' ')}</div>`;
      div.appendChild(el);
    });
    kbd.appendChild(div);
  });
  $('kbdNote').innerHTML = S.note;
}
buildKbd();
</script>
